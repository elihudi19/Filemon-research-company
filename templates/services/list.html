{% extends "base.html" %}
{% block title %}Huduma Zetu — {{ COMPANY_NAME }}{% endblock %}
{% block content %}
<section class="container">
  <h2 class="section-title">Huduma Tunazotoa</h2>
  <div class="card-grid">
    {% for service in services %}
      <div class="card">
        <h3>{{ service.title_en }}</h3>
        <p>{{ service.description_en }}</p>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
