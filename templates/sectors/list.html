{% extends "base.html" %}
{% block title %}Sekta Zetu — {{ COMPANY_NAME }}{% endblock %}
{% block content %}
<section class="container">
  <h2 class="section-title">Sekta za Utafiti</h2>
  {% for sector in sectors %}
    <div class="sector-card">
      <h3><a href="{{ sector.get_absolute_url }}">{{ sector.name_en }}</a></h3>
      <p>{{ sector.summary_en|truncatewords:25 }}</p>
    </div>
  {% empty %}
    <p>Hakuna sekta iliyoongezwa bado.</p>
  {% endfor %}
</section>
{% endblock %}
